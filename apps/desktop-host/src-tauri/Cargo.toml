[package]
name = "nova-desktop-host"
version = "0.2.0"
edition = "2021"

[features]
default = ["tauri-app"]
tauri-app = ["dep:tauri"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", optional = true }
url = "2"

[build-dependencies]
tauri-build = "2"
